[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "raypack"
version = "0.0.2"
description = "RayPack high-compression archive tool with explicit Smart Media mode"
requires-python = ">=3.11"
authors = [{name = "ray20123315"}]
dependencies = ["brotli>=1.1,<2", "zstandard>=0.23,<1", "Pillow>=11,<13"]
[project.scripts]
raypack = "raypack.cli:main"
[tool.setuptools]
package-dir = {"" = "src"}
[tool.setuptools.packages.find]
where = ["src"]
