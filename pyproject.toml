[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "raypack"
version = "0.0.1"
description = "RayPack - user-friendly lossless high-compression archive tool"
authors = [{ name = "ray20123315" }]
requires-python = ">=3.11"
dependencies = [
  "brotli>=1.1,<2",
  "zstandard>=0.23,<1",
]

[project.scripts]
raypack = "raypack.cli:main"

[project.gui-scripts]
raypack-gui = "raypack.gui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
